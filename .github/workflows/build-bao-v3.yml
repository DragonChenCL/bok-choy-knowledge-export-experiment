name: Build Bao Rescue v3 PDF

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_bao_v3.py'
      - '06-assets/bao-rescue/v3/source/**'
      - '.github/workflows/build-bao-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install reportlab pillow

      - name: Build PDF
        run: python scripts/build_bao_v3.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06-assets/bao-rescue/v3/bao-rescue-photo-guide-v3.pdf
          if git diff --cached --quiet; then
            echo "PDF already up to date"
          else
            git commit -m "assets: build Bao Rescue v3 PDF [skip ci]"
            git push
          fi
