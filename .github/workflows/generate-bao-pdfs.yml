name: Generate Bao Rescue PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_bao_pdfs.py'
      - 'requirements-bao.txt'
      - '.github/workflows/generate-bao-pdfs.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-bao.txt

      - name: Generate PDFs
        run: python scripts/generate_bao_pdfs.py

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06-assets/bao-rescue/bao-rescue-guide-v1.pdf 06-assets/bao-rescue/bao-rescue-quick-diagnostic-v1.pdf
          if git diff --cached --quiet; then
            echo "No generated PDF changes."
            exit 0
          fi
          git commit -m "build: generate Bao Rescue PDF deliverables"
          git push
