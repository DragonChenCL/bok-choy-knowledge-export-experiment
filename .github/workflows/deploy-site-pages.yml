name: Deploy Bao Rescue Site
# Bao Rescue is served from the production root. Legacy /diagnose/ remains only as a compatibility redirect.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '06-assets/bao-rescue/v4/bao-sprite.webp'
      - '06-assets/bao-rescue/v4/web-v2-parts/**'
      - 'scripts/qa-bao-mvp.cjs'
      - 'scripts/qa-bao-phase1.cjs'
      - '.github/workflows/deploy-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run P0 decision-path QA
        run: node scripts/qa-bao-mvp.cjs

      - name: Run Phase 1 analytics and SEO QA
        run: node scripts/qa-bao-phase1.cjs

      - name: Stage latest site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/

          mkdir -p _site/assets/bao-rescue
          cp 06-assets/bao-rescue/v4/bao-sprite.webp _site/assets/bao-rescue/bao-sprite.webp
          test -s _site/assets/bao-rescue/bao-sprite.webp
          test "$(stat -c%s _site/assets/bao-rescue/bao-sprite.webp)" -gt 100000
          file _site/assets/bao-rescue/bao-sprite.webp | grep -qi 'Web/P'

          cat 06-assets/bao-rescue/v4/web-v2-parts/part-* | base64 --ignore-garbage -d > _site/assets/bao-rescue/bao-sprite-v2.webp
          test "$(stat -c%s _site/assets/bao-rescue/bao-sprite-v2.webp)" -eq 60674
          file _site/assets/bao-rescue/bao-sprite-v2.webp | grep -qi 'Web/P'
          echo '98060136bf7b8c0fae74c4819d8d4f0a66fa15e5b07d70105c5878fbbb6827f2  _site/assets/bao-rescue/bao-sprite-v2.webp' | sha256sum -c -

          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > _site/build.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "built_at": "${BUILD_TIME}",
            "product_stage": "PHASE1_ANALYTICS_SEO_ROOT"
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import os

          sha = os.environ['GITHUB_SHA']
          ga_id = 'G-GVD03YFR9C'
          ga_snippet = f'''<script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{ga_id}', {{'send_page_view': false}});
          </script>'''

          def add_ga(html):
              if ga_id not in html:
                  html = html.replace('</head>', ga_snippet + '\n</head>', 1)
              return html

          root = Path('_site/index.html')
          text = root.read_text(encoding='utf-8')
          marker = f'<!-- deployed-commit:{sha} -->'
          if marker not in text:
              text = text.replace('</head>', f'  {marker}\n</head>', 1)
          text = add_ga(text)
          root.write_text(text, encoding='utf-8')

          old_domain = 'https://dragonchencl.github.io/bok-choy-knowledge-export-experiment'
          new_domain = 'https://bao.serunio.com'
          seo_pages = [
              Path('_site/bao-buns-collapse-after-steaming/index.html'),
              Path('_site/why-do-steamed-buns-wrinkle/index.html'),
              Path('_site/why-are-bao-buns-not-fluffy/index.html'),
          ]
          for path in seo_pages:
              html = path.read_text(encoding='utf-8')
              html = html.replace(old_domain, new_domain)
              html = html.replace('../diagnose/?', '../?').replace('../diagnose/', '../')
              if 'property="og:image"' not in html:
                  meta = '<link rel="icon" type="image/png" sizes="64x64" href="../assets/bao-rescue/bao-rescue-icon-64.png"><meta property="og:image" content="https://bao.serunio.com/assets/bao-rescue/bao-rescue-icon-64.png"><meta name="twitter:card" content="summary"><meta name="twitter:image" content="https://bao.serunio.com/assets/bao-rescue/bao-rescue-icon-64.png">'
                  html = html.replace('<link rel="stylesheet"', meta + '<link rel="stylesheet"', 1)
              html = add_ga(html)
              path.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Verify staged site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/diagnose/index.html
          test -s _site/diagnose/styles.css
          test -s _site/diagnose/data.js
          test -s _site/diagnose/app.js
          test -s _site/analytics.js
          test -s _site/seo.css
          test -s _site/bao-buns-collapse-after-steaming/index.html
          test -s _site/why-do-steamed-buns-wrinkle/index.html
          test -s _site/why-are-bao-buns-not-fluffy/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test -s _site/assets/bao-rescue/bao-sprite.webp
          test -s _site/assets/bao-rescue/bao-sprite-v2.webp
          test -s _site/assets/bao-rescue/bao-rescue-icon-64.png
          test -s _site/build.json

          grep -q 'product-stage:MVP_FREEZE' _site/index.html
          grep -q 'Why did my bao fail?' _site/index.html
          grep -q 'meta name="robots" content="index,follow' _site/index.html
          grep -q 'rel="canonical" href="https://bao.serunio.com/"' _site/index.html
          grep -q 'property="og:image"' _site/index.html
          grep -q 'deployed-commit:${{ github.sha }}' _site/index.html
          grep -q '${{ github.sha }}' _site/build.json
          grep -q 'PHASE1_ANALYTICS_SEO_ROOT' _site/build.json
          grep -q 'location.replace' _site/diagnose/index.html
          grep -q 'Sitemap: https://bao.serunio.com/sitemap.xml' _site/robots.txt
          grep -q '<loc>https://bao.serunio.com/</loc>' _site/sitemap.xml
          grep -q 'href="../?entry=' _site/bao-buns-collapse-after-steaming/index.html
          grep -q 'href="../?entry=' _site/why-do-steamed-buns-wrinkle/index.html
          grep -q 'href="../?entry=' _site/why-are-bao-buns-not-fluffy/index.html
          grep -q 'G-GVD03YFR9C' _site/index.html
          grep -q 'G-GVD03YFR9C' _site/bao-buns-collapse-after-steaming/index.html
          grep -q 'G-GVD03YFR9C' _site/why-do-steamed-buns-wrinkle/index.html
          grep -q 'G-GVD03YFR9C' _site/why-are-bao-buns-not-fluffy/index.html
          grep -q "send_page_view': false" _site/index.html

          if grep -R --include='*.html' --include='*.xml' --include='*.txt' 'dragonchencl.github.io/bok-choy-knowledge-export-experiment' _site; then
            echo 'Old GitHub Pages canonical/domain detected'
            exit 1
          fi
          if grep -R '../diagnose/' _site/bao-buns-collapse-after-steaming _site/why-do-steamed-buns-wrinkle _site/why-are-bao-buns-not-fluffy; then
            echo 'Legacy diagnosis CTA detected in SEO pages'
            exit 1
          fi
          if grep -R 'v3/source\|sprite-q20' _site/diagnose _site/index.html; then
            echo 'Old thumbnail dependency detected'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
