name: Deploy Bao Rescue Site
# P0 closure trigger: reviewed HD sprite installed and byte-verified.

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '06-assets/bao-rescue/v4/bao-sprite.webp'
      - 'scripts/qa-bao-mvp.cjs'
      - '.github/workflows/deploy-site-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run P0 decision-path QA
        run: node scripts/qa-bao-mvp.cjs

      - name: Stage latest site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # The repository site directory is the single deploy source.
          cp -R site/. _site/

          # Publish the reviewed P0 sprite directly. Do not reconstruct old q20 parts.
          mkdir -p _site/assets/bao-rescue
          cp 06-assets/bao-rescue/v4/bao-sprite.webp _site/assets/bao-rescue/bao-sprite.webp
          test -s _site/assets/bao-rescue/bao-sprite.webp
          test "$(stat -c%s _site/assets/bao-rescue/bao-sprite.webp)" -gt 100000
          file _site/assets/bao-rescue/bao-sprite.webp | grep -qi 'Web/P'

          # Trace the exact deployed commit.
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > _site/build.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "built_at": "${BUILD_TIME}",
            "product_stage": "MVP_FREEZE_P0"
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import os
          sha = os.environ['GITHUB_SHA']
          path = Path('_site/diagnose/index.html')
          text = path.read_text(encoding='utf-8')
          marker = f'<!-- deployed-commit:{sha} -->'
          if marker not in text:
              text = text.replace('</head>', f'  {marker}\n</head>', 1)
          path.write_text(text, encoding='utf-8')
          PY

          touch _site/.nojekyll

      - name: Verify staged MVP
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/diagnose/index.html
          test -s _site/diagnose/styles.css
          test -s _site/diagnose/data.js
          test -s _site/diagnose/app.js
          test -s _site/assets/bao-rescue/bao-sprite.webp
          test -s _site/build.json

          grep -q 'diagnose/' _site/index.html
          grep -q 'product-stage:MVP_FREEZE' _site/diagnose/index.html
          grep -q 'Why did my bao fail?' _site/diagnose/index.html
          grep -q 'bao-sprite.webp' _site/diagnose/styles.css
          grep -q 'deployed-commit:${{ github.sha }}' _site/diagnose/index.html
          grep -q '${{ github.sha }}' _site/build.json
          grep -q 'Cracked/opened, frozen/reheated, or another unlisted case.' _site/diagnose/index.html

          # Prevent regression to the old thumbnail / q20 reconstruction path.
          if grep -R 'v3/source\|sprite-q20' _site/diagnose _site/index.html; then
            echo 'Old thumbnail dependency detected'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
