name: Payment Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'payment-gateway/**'
      - '.github/workflows/payment-gateway-ci.yml'
  pull_request:
    paths:
      - 'payment-gateway/**'
      - '.github/workflows/payment-gateway-ci.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        run: npm run typecheck
