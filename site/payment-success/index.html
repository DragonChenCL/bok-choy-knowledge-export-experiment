<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment status — Bao Rescue</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4a62a">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260909-2">
  <style>
    :root{--bg:#f7f4ee;--card:#fffdf9;--text:#252922;--muted:#6b7167;--line:#ddd8cf;--green:#566848;--orange:#f4a62a;--red:#a14c43}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}
    .wrap{max-width:720px;margin:0 auto;padding:40px 20px 72px}.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;margin-bottom:24px}.brand img{width:38px;height:38px;border-radius:10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 10px 30px rgba(35,39,32,.05);text-align:center}.icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#f1eee7;font-size:30px}
    h1{margin:0 0 8px;font-size:32px}.lead{margin:0 auto 22px;color:var(--muted);max-width:560px}.details{margin:24px 0 0;text-align:left;border-top:1px solid var(--line);padding-top:18px}.row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;font-size:14px}.row span:first-child{color:var(--muted)}.row span:last-child{font-weight:700;text-align:right;word-break:break-word}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px}.primary{background:var(--green);color:#fff}.secondary{border:1px solid var(--line);color:var(--green);background:#fff}
    .pending .icon{animation:pulse 1.4s ease-in-out infinite}.paid .icon{background:#eef4ea}.failed .icon{background:#faecea}.paid h1{color:var(--green)}.failed h1{color:var(--red)}
    .support{margin-top:20px;color:var(--muted);font-size:13px}.support a{color:var(--green)}
    @keyframes pulse{50%{transform:scale(1.06);opacity:.72}}
    @media(max-width:560px){.card{padding:28px 20px}.row{flex-direction:column;gap:2px}.row span:last-child{text-align:left}}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/bao-rescue/bao-rescue-icon-64.png" alt=""><span>Bao Rescue</span></a>
    <main id="card" class="card pending">
      <div id="icon" class="icon">…</div>
      <h1 id="title">Confirming your payment</h1>
      <p id="lead" class="lead">We are checking the payment confirmation from Waffo. This normally takes only a few seconds.</p>
      <div id="details" class="details" hidden>
        <div class="row"><span>Order</span><span id="orderId">—</span></div>
        <div class="row"><span>Status</span><span id="status">—</span></div>
        <div class="row"><span>Product</span><span id="product">—</span></div>
        <div class="row"><span>Reference</span><span id="reference">—</span></div>
      </div>
      <div class="actions">
        <a class="btn primary" href="/">Back to Bao Rescue</a>
        <button id="retry" class="btn secondary" type="button" style="cursor:pointer">Check again</button>
      </div>
      <div class="support">Need help? <a href="mailto:support@serunio.com">support@serunio.com</a></div>
    </main>
  </div>
  <script>
    const API_BASE = 'https://payment-gateway.chenlongqrr.workers.dev';
    const paymentId = new URLSearchParams(location.search).get('payment');
    const card = document.getElementById('card');
    const icon = document.getElementById('icon');
    const title = document.getElementById('title');
    const lead = document.getElementById('lead');
    const details = document.getElementById('details');
    const retry = document.getElementById('retry');
    let attempts = 0;
    let timer = null;

    function showInvalid(message) {
      card.className = 'card failed';
      icon.textContent = '!';
      title.textContent = 'We could not verify this payment';
      lead.textContent = message;
      retry.hidden = true;
    }

    function render(order) {
      details.hidden = false;
      document.getElementById('orderId').textContent = order.gatewayOrderId || paymentId || '—';
      document.getElementById('status').textContent = order.status || 'unknown';
      document.getElementById('product').textContent = order.sku === 'next-batch-fix' ? 'Next-Batch Fix' : (order.sku || '—');
      document.getElementById('reference').textContent = order.referenceId || '—';

      if (order.paid) {
        clearTimeout(timer);
        card.className = 'card paid';
        icon.textContent = '✓';
        title.textContent = 'Payment confirmed';
        lead.textContent = 'Your payment was confirmed successfully. Your Next-Batch Fix can now be unlocked from the diagnosis result flow.';
        retry.hidden = true;
        return;
      }

      if (order.status === 'refunded') {
        clearTimeout(timer);
        card.className = 'card failed';
        icon.textContent = '↩';
        title.textContent = 'Payment refunded';
        lead.textContent = 'This order has been refunded, so paid access is no longer active.';
        retry.hidden = true;
        return;
      }

      card.className = 'card pending';
      icon.textContent = '…';
      title.textContent = 'Payment is still processing';
      lead.textContent = 'Waffo has returned you to Bao Rescue, but the server confirmation has not arrived yet. We will keep checking for a short time.';
    }

    async function checkPayment(auto = false) {
      if (!paymentId || !/^PG_[A-Za-z0-9]+$/.test(paymentId)) {
        showInvalid('The payment reference in this URL is missing or invalid.');
        return;
      }

      attempts += 1;
      try {
        const res = await fetch(`${API_BASE}/payment/${encodeURIComponent(paymentId)}`, { cache: 'no-store' });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 404 && attempts < 8) {
            if (auto) timer = setTimeout(() => checkPayment(true), 1800);
            return;
          }
          showInvalid(body.error || 'The payment gateway could not find this order.');
          return;
        }

        render(body);
        if (!body.paid && body.status !== 'refunded' && auto && attempts < 10) {
          timer = setTimeout(() => checkPayment(true), 1800);
        }
      } catch (err) {
        if (auto && attempts < 6) {
          timer = setTimeout(() => checkPayment(true), 2200);
        } else {
          showInvalid('The payment status service is temporarily unavailable. Please try again in a moment.');
        }
      }
    }

    retry.addEventListener('click', () => {
      clearTimeout(timer);
      attempts = 0;
      checkPayment(true);
    });

    checkPayment(true);
  </script>
</body>
</html>
